# 内阁手机端依赖目录（version catalog）——版本集中单点，模块脚本只引用别名。
# 升级版本改这里；新增依赖先登记再引用。
[versions]
agp = "8.8.2"
kotlin = "1.9.24"
coreKtx = "1.13.1"
appcompat = "1.7.0"
activityKtx = "1.9.3"
okhttp = "4.12.0"
zxingEmbedded = "4.3.0"
tensorflowLite = "2.14.0"
onnxruntimeAndroid = "1.31.1"
junit = "4.13.2"
ktlintPlugin = "12.1.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# 协议层 JVM 测试挂账（2026-10-27）：客户端线程模型（HandlerThread 贯穿构造与
# 收发）在纯 JVM 单测不可 mock（android.jar stub 抛 not mocked），MockWebServer
# 全链路测试需 Robolectric 或等 ScreenAssistService 架构拆分批注入线程后再接
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntimeAndroid" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
