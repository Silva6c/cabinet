# 内阁（Cabinet）配置示例
# 复制为 configs/cabinet.toml 后修改；首次运行 cabinet 也会自动生成默认配置。
# 注意：configs/cabinet.toml 含令牌，不进 git（已在 .gitignore 排除）。

# WSS 监听地址；":9527" 监听所有网卡（局域网手机需能访问）
bind = ":9527"

# 配对令牌（64 hex 字符）。为空时首次启动自动生成随机令牌并回写本文件。
# 用 `cabinet -gen-token` 可手动生成。手机端配对即用此令牌。
token = "请运行 cabinet -gen-token 生成并粘贴到这里"

[tls]
# 自签证书目录。铁律：证书一经生成绝不自动重建（手机端固定证书指纹，
# 重建 = 全部手机断联）。确需重签请人工删除目录内文件并重新配对。
cert_dir = "cert"

[log]
# 日志级别：debug / info / warn / error
level = "info"
# 日志文件（控制台+文件双写）；留空则只写控制台
file = "logs/cabinet.log"
# 单文件上限（MB）与保留个数，超过滚动压缩
max_size_mb = 10
max_backups = 5

[engine]
# 引擎桥开关；关闭时服务退化为无引擎模式（position 回 not_ready）
enable = true
# 皮卡鱼可执行文件（官方 universal 构建自带 CPU 特性分发）
path = "library/engine/pikafish.exe"
# NNUE 权重（EvalFile）。相对路径按"资源根"解析（exe 目录；便携包为 appdata\），
# 绝对路径原样使用；资源根解析见 internal/config/root.go
nnue = "library/nnue/pikafish.nnue"
# 引擎线程数；0 = 引擎自定（占满物理核）
threads = 0
# 哈希表大小（MB）；悬浮窗/面板切换后 PC 自动落盘回写本文件（重启保持）
hash_mb = 256
# 多路 PV 线数（悬浮窗"变招"按钮的多路候选来源）。1 = 单线最强棋力；
# 调大后同深度搜索树分散、棋力下降（变招是用户手动开启的功能）
multi_pv = 1
# 固定深度制搜索目标深度
depth = 20
# 思考模式时间制上限（毫秒）；0 = 时间制关闭，按深度制搜索（默认，不限思考时间）。
# >0（500–20000）时引擎每步限时（go movetime），恒定耗时、出建议更快
movetime_ms = 0
# 智能思考（默认关；PC 调参面板可热切并回写本文件，仅电脑端生效——手机端
# 无感知）。开启后按局面与搜索收敛度自适应分配算力：唯一/极少着法的局面本轮
# 直接低预算秒出；主线着法连续多层稳定且分数平稳即提前收束（速度优先，深度
# 略浅）。思考上限仍受当前深度制/时间制约束
# smart = false
# 不走任何库（默认关；PC 高级面板→开局库可热切并回写本文件）。开启后建议链
# 跳过全部库——桔库、沉淀、云库（含 cloud_first）都不查，每步引擎直搜；只停
# "查"不停"记"（引擎建议照常沉淀）。优先级高于 cloud_first。
# skip_books = false

# ── 云端开局库（可选，默认关）───────────────────────────────
# 桔库与沉淀都未命中时，向云端开局库查询该局面。⚠开启即表示同意把
# 对局局面 FEN 发往所配端点；端点默认预设 chessdb.cn（免费公开基建，
# 免 key）。自带 API 的使用者替换 endpoint / api_key 即可。查询异步、
# 限速 ≥1.5s 一次、结果按 FEN 缓存、失败静默不影响引擎建议。
# cloud_first = "默认走云库"（2026-10-30，默认关；需 enable = true）：
# 开启后每步先查云库——命中即采用 cloud 建议并不再查本地库/引擎，
# 未命中自动回落常规链。⚠隐私口径同 enable：局面 FEN 必然发往端点。
# endgame = "残局库查询"（2026-11-01，默认关；独立于 enable）：
# 开启后本地库/沉淀未命中的局面另发一条残局库查询（云库穷举残局表，
# 绝对正解），命中以"残局库"来源展示。⚠隐私口径同 enable。
# [cloudbook]
# enable = false
# cloud_first = false
# endgame = false
# endpoint = "https://www.chessdb.cn/chessdb.php"
# api_key = ""

# ── 桔库目录（2026-11-01 控制台可调）─────────────────────────
# 库目录（*.obk 及 *.obk.zip；目录内文件增删自动热加载）。仅支持 OBK
# （兵河格式，SQLite）开局库文件；库文件自备，请遵守原发布者授权。
# 控制台"导入库文件"自动放入本目录并热生效。
# [library]
# books_dir = "library/books"
# order = 自定义优先级：库名列表（文件名去 .obk）按优先级排列，首位最先
#   查询；目录里有但未列入的库按文件名字典序排尾部（新库自动可用）。
#   控制台"上移/下移"调整后自动落盘回写。空 = 维持字典序。
#   order = ["桔库09.09.2023精修库"]
# disabled = 禁用的库名列表（只展示不加载）；控制台"启用/禁用"回写。
#   disabled = []
